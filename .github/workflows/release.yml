name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Dockerfile'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'

permissions: {}

jobs:
  validate:
    name: Release validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Build release candidate
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DVECTORFORGE_BUILD_BENCHMARKS=OFF
          cmake --build build-release --parallel 2
          ./build-release/vectorforge --help
      - name: Build production container
        run: docker build --build-arg VERSION=pr-validation -t vectorforge:pr-validation .

  build:
    name: Release binary (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: Configure and build native CLI
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVECTORFORGE_BUILD_BENCHMARKS=OFF
          cmake --build build --config Release --parallel 2
      - name: Stage native binary
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          case "${RUNNER_OS}" in
            Linux)
              ARCH="$(uname -m)"
              TARGET="${ARCH}-unknown-linux-gnu"
              cp build/vectorforge "dist/vectorforge-${VERSION}-${TARGET}"
              ;;
            macOS)
              ARCH="$(uname -m)"
              if [[ "${ARCH}" == 'arm64' ]]; then
                TARGET='aarch64-apple-darwin'
              else
                TARGET='x86_64-apple-darwin'
              fi
              cp build/vectorforge "dist/vectorforge-${VERSION}-${TARGET}"
              ;;
            Windows)
              TARGET='x86_64-pc-windows-msvc'
              cp build/Release/vectorforge.exe "dist/vectorforge-${VERSION}-${TARGET}.exe"
              ;;
            *)
              echo "Unsupported runner OS: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release and GHCR image
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v5
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Resolve release version
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum vectorforge-* > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ steps.vars.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_REF" >/dev/null 2>&1; then
            gh release upload "$RELEASE_REF" dist/* --clobber
          else
            gh release create "$RELEASE_REF" dist/* --verify-tag --title "Karzoun VectorForge ${RELEASE_REF}" --generate-notes
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish container with SBOM and provenance
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          sbom: true
          provenance: mode=max
